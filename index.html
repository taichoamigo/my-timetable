<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>爆速時刻表</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="station-bar">
      <select id="station-select" aria-label="駅を選択"></select>
      <button id="locate-btn" type="button" title="現在地から再取得">📍</button>
    </div>
    <div class="meta-bar">
      <span id="status-text">測位中...</span>
      <div class="controls">
        <button id="daytype-btn" type="button"></button>
        <span id="clock">--:--</span>
      </div>
    </div>
  </header>

  <main id="timetable-container"></main>

  <script src="./app.js"></script>
</body>
</html>
