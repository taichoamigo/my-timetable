<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>爆速時刻表</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="station-bar">
      <select id="station-select" aria-label="駅を選択"></select>
      <button id="locate-btn" type="button" title="現在地から再取得">📍</button>
      <button id="settings-btn" type="button" title="表示駅の設定">⚙️</button>
    </div>
    <div class="meta-bar">
      <span id="status-text">測位中...</span>
      <div class="controls">
        <button id="daytype-btn" type="button"></button>
        <span id="clock">--:--</span>
      </div>
    </div>
  </header>

  <main id="timetable-container"></main>

  <!-- 駅設定モーダル -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2>使用する駅を選択</h2>
        <button id="close-settings-btn" type="button" aria-label="閉じる">✕</button>
      </div>
      <div id="station-checklist" class="checklist"></div>
      <div class="modal-footer">
        <button id="save-settings-btn" type="button" class="primary-btn">保存して反映</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
